<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>amxpvtx</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #08080c;
    --surface: #0f0f16;
    --border: rgba(255,255,255,0.07);
    --accent: #c8a96e;
    --accent2: #7c6fff;
    --text: #e8e4dc;
    --muted: rgba(232,228,220,0.45);
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── CANVAS BACKGROUND ── */
  #bg-canvas {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }

  /* ── GRAIN OVERLAY ── */
  body::after {
    content: '';
    position: fixed; inset: 0; z-index: 1;
    pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 180px 180px;
    opacity: 0.5;
  }

  /* ── LAYOUT ── */
  #app { position: relative; z-index: 2; }

  /* ── VIEWS ── */
  .view { display: none; min-height: 100vh; }
  .view.active { display: block; }

  /* ── HOME ── */
  #home {
    padding: 0 20px 80px;
  }

  .hero {
    text-align: center;
    padding: 80px 20px 60px;
    position: relative;
  }

  .hero-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--accent);
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1s 0.2s forwards;
  }

  .hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 14vw, 100px);
    font-weight: 300;
    line-height: 0.9;
    letter-spacing: -0.02em;
    margin: 16px 0 24px;
    opacity: 0;
    animation: fadeUp 1s 0.4s forwards;
  }

  .hero-title em {
    font-style: italic;
    color: var(--accent);
  }

  .hero-sub {
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--muted);
    opacity: 0;
    animation: fadeUp 1s 0.6s forwards;
  }

  .hero-line {
    width: 1px;
    height: 60px;
    background: linear-gradient(to bottom, transparent, var(--accent), transparent);
    margin: 40px auto 0;
    opacity: 0;
    animation: fadeIn 1s 1s forwards;
  }

  /* ── TRACK GRID ── */
  .section-label {
    font-size: 9px;
    letter-spacing: 0.5em;
    color: var(--muted);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 32px;
  }

  .tracks-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1px;
    max-width: 680px;
    margin: 0 auto;
    border: 1px solid var(--border);
  }

  .track-card {
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.3s;
    animation: fadeUp 0.6s both;
  }

  .track-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(200,169,110,0.05), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .track-card:hover { background: #13131c; }
  .track-card:hover::before { opacity: 1; }

  .track-art {
    width: 56px;
    height: 56px;
    border-radius: 2px;
    object-fit: cover;
    flex-shrink: 0;
    background: #1a1a26;
    border: 1px solid var(--border);
  }

  .track-art-placeholder {
    width: 56px;
    height: 56px;
    border-radius: 2px;
    flex-shrink: 0;
    background: linear-gradient(135deg, #1a1a26, #0f0f18);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    opacity: 0.6;
  }

  .track-info { flex: 1; min-width: 0; }

  .track-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 4px;
  }

  .track-caption {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.05em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .track-play {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
    transition: all 0.3s;
    font-size: 14px;
  }

  .track-play:hover {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  .track-play.playing {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }

  /* ── AUDIO PLAYER BAR ── */
  #player-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(8,8,12,0.96);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 12px 20px 20px;
    transform: translateY(100%);
    transition: transform 0.4s cubic-bezier(0.4,0,0.2,1);
  }

  #player-bar.visible { transform: translateY(0); }

  .player-inner {
    max-width: 680px;
    margin: 0 auto;
  }

  .player-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .player-art {
    width: 40px;
    height: 40px;
    border-radius: 2px;
    object-fit: cover;
    background: #1a1a26;
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .player-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 300;
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .player-close {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 18px;
    padding: 4px;
  }

  .progress-bar {
    width: 100%;
    height: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 1px;
    cursor: pointer;
    margin-bottom: 6px;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(to right, var(--accent), var(--accent2));
    border-radius: 1px;
    width: 0%;
    transition: width 0.1s linear;
  }

  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty-state svg {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    opacity: 0.3;
    display: block;
  }

  .empty-state p {
    font-size: 12px;
    letter-spacing: 0.2em;
  }

  /* ── ADMIN TRIGGER ── */
  #admin-trigger {
    position: fixed;
    bottom: 24px;
    right: 20px;
    z-index: 200;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    backdrop-filter: blur(10px);
  }

  #admin-trigger:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── PASSWORD MODAL ── */
  #pass-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 300;
    background: rgba(8,8,12,0.92);
    backdrop-filter: blur(24px);
    align-items: center;
    justify-content: center;
  }

  #pass-modal.open { display: flex; }

  .modal-box {
    width: 90%;
    max-width: 360px;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 40px 32px;
    text-align: center;
    animation: scaleIn 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  .modal-eyebrow {
    font-size: 9px;
    letter-spacing: 0.5em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .modal-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    margin-bottom: 32px;
    color: var(--text);
  }

  .input-wrap {
    position: relative;
    margin-bottom: 20px;
  }

  .input-wrap input {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 0;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.3s;
    letter-spacing: 0.3em;
    text-align: center;
  }

  .input-wrap input:focus { border-color: var(--accent); }
  .input-wrap input::placeholder { letter-spacing: 0.2em; color: var(--muted); font-size: 11px; }

  .btn-primary {
    width: 100%;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    padding: 14px;
    cursor: pointer;
    transition: all 0.3s;
    margin-bottom: 12px;
  }

  .btn-primary:hover {
    background: var(--accent);
    color: var(--bg);
  }

  .btn-ghost {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 8px;
    transition: color 0.3s;
  }

  .btn-ghost:hover { color: var(--text); }

  .error-msg {
    font-size: 10px;
    color: #ff6b6b;
    letter-spacing: 0.15em;
    margin-top: 8px;
    min-height: 16px;
  }

  /* ── ADMIN PANEL ── */
  #admin {
    padding: 0 20px 80px;
  }

  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .admin-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
  }

  .admin-back {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 8px 16px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .admin-back:hover {
    border-color: var(--text);
    color: var(--text);
  }

  .upload-form {
    max-width: 500px;
    margin: 0 auto;
  }

  .form-field {
    margin-bottom: 28px;
  }

  .form-label {
    display: block;
    font-size: 9px;
    letter-spacing: 0.4em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .form-input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 14px 16px;
    outline: none;
    transition: border-color 0.3s;
    border-radius: 0;
  }

  .form-input:focus { border-color: var(--accent); }
  .form-input::placeholder { color: var(--muted); font-size: 11px; }

  textarea.form-input {
    resize: vertical;
    min-height: 80px;
    font-size: 12px;
    line-height: 1.6;
  }

  .upload-zone {
    border: 1px dashed rgba(200,169,110,0.3);
    background: rgba(200,169,110,0.02);
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }

  .upload-zone:hover, .upload-zone.drag {
    border-color: var(--accent);
    background: rgba(200,169,110,0.06);
  }

  .upload-zone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .upload-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.5; }
  .upload-hint { font-size: 10px; letter-spacing: 0.2em; color: var(--muted); }
  .upload-name { font-size: 11px; color: var(--accent); margin-top: 8px; letter-spacing: 0.05em; }

  .preview-art {
    width: 100%;
    max-height: 160px;
    object-fit: cover;
    border: 1px solid var(--border);
    margin-top: 12px;
    display: none;
  }

  .submit-btn {
    width: 100%;
    background: var(--accent);
    border: none;
    color: var(--bg);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    padding: 18px;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 8px;
  }

  .submit-btn:hover { opacity: 0.85; }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .success-toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--accent);
    color: var(--bg);
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding: 12px 24px;
    opacity: 0;
    transition: all 0.4s;
    z-index: 500;
    pointer-events: none;
  }

  .success-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* track card stagger */
  .track-card:nth-child(1) { animation-delay: 0.1s; }
  .track-card:nth-child(2) { animation-delay: 0.2s; }
  .track-card:nth-child(3) { animation-delay: 0.3s; }
  .track-card:nth-child(4) { animation-delay: 0.4s; }
  .track-card:nth-child(5) { animation-delay: 0.5s; }

  /* waveform bars */
  .wave-bars {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 20px;
    margin-left: 4px;
  }

  .bar {
    width: 2px;
    background: var(--accent);
    border-radius: 1px;
    animation: pulse 0.8s ease-in-out infinite alternate;
  }

  .bar:nth-child(1) { height: 8px;  animation-delay: 0s; }
  .bar:nth-child(2) { height: 16px; animation-delay: 0.1s; }
  .bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
  .bar:nth-child(4) { height: 18px; animation-delay: 0.15s; }
  .bar:nth-child(5) { height: 7px;  animation-delay: 0.05s; }

  @keyframes pulse {
    from { transform: scaleY(0.4); opacity: 0.5; }
    to   { transform: scaleY(1); opacity: 1; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="app">

  <!-- ── HOME VIEW ── -->
  <div id="home" class="view active">
    <div class="hero">
      <div class="hero-eyebrow">Official music platform</div>
      <h1 class="hero-title"><em>amxpvtx</em></h1>
      <p class="hero-sub">Original music · Shared freely</p>
      <div class="hero-line"></div>
    </div>

    <p class="section-label">Latest releases</p>

    <div class="tracks-grid" id="tracks-grid">
      <!-- tracks injected here -->
    </div>

    <div class="empty-state" id="empty-state">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
        <circle cx="24" cy="24" r="20"/>
        <circle cx="24" cy="24" r="8"/>
        <line x1="24" y1="4" x2="24" y2="16"/>
        <line x1="24" y1="32" x2="24" y2="44"/>
      </svg>
      <p>No songs yet</p>
    </div>
  </div>

  <!-- ── ADMIN VIEW ── -->
  <div id="admin" class="view">
    <div class="admin-header">
      <div>
        <div style="font-size:9px;letter-spacing:0.4em;color:var(--accent);text-transform:uppercase;margin-bottom:6px">amxpvtx · Admin</div>
        <div class="admin-title">Upload Song</div>
      </div>
      <button class="admin-back" onclick="showHome()">← Back</button>
    </div>

    <div class="upload-form">

      <!-- Song title -->
      <div class="form-field">
        <label class="form-label">Song title</label>
        <input class="form-input" id="song-title" type="text" placeholder="Enter song name...">
      </div>

      <!-- Caption -->
      <div class="form-field">
        <label class="form-label">Caption</label>
        <textarea class="form-input" id="song-caption" placeholder="What's this song about..."></textarea>
      </div>

      <!-- Cover image -->
      <div class="form-field">
        <label class="form-label">Cover image</label>
        <div class="upload-zone" id="img-zone">
          <input type="file" id="img-input" accept="image/*" onchange="previewImg(this)">
          <div class="upload-icon">🖼</div>
          <div class="upload-hint">Tap to choose image</div>
          <div class="upload-name" id="img-name"></div>
          <img class="preview-art" id="img-preview">
        </div>
      </div>

      <!-- Audio file -->
      <div class="form-field">
        <label class="form-label">Audio file</label>
        <div class="upload-zone" id="audio-zone">
          <input type="file" id="audio-input" accept="audio/*" onchange="previewAudio(this)">
          <div class="upload-icon">🎵</div>
          <div class="upload-hint">Tap to choose audio</div>
          <div class="upload-name" id="audio-name"></div>
        </div>
      </div>

      <button class="submit-btn" id="submit-btn" onclick="uploadSong()">
        Publish Song
      </button>
    </div>
  </div>

</div>

<!-- ── PLAYER BAR ── -->
<div id="player-bar">
  <div class="player-inner">
    <div class="player-top">
      <img class="player-art" id="player-art" src="" alt="">
      <div class="player-title" id="player-title"></div>
      <div class="wave-bars" id="wave-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <button class="player-close" onclick="stopPlayer()">✕</button>
    </div>
    <div class="progress-bar" id="progress-bar" onclick="seekAudio(event)">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <div class="time-row">
      <span id="time-cur">0:00</span>
      <span id="time-dur">0:00</span>
    </div>
  </div>
</div>

<!-- ── ADMIN TRIGGER ── -->
<button id="admin-trigger" onclick="openPassModal()" title="Admin">⬡</button>

<!-- ── PASSWORD MODAL ── -->
<div id="pass-modal">
  <div class="modal-box">
    <div class="modal-eyebrow">Access required</div>
    <div class="modal-title">Enter password</div>
    <div class="input-wrap">
      <input type="password" id="pass-input" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPass()">
    </div>
    <div class="error-msg" id="pass-error"></div>
    <button class="btn-primary" onclick="checkPass()">Enter</button>
    <button class="btn-ghost" onclick="closePassModal()">Cancel</button>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="success-toast" id="toast"></div>

<audio id="audio-el"></audio>

<script>
// ── CONFIG ──
const ADMIN_PASSWORD = 'AmjadAli123'; // Change this!

// ── STATE ──
let songs = JSON.parse(localStorage.getItem('amxpvtx_songs') || '[]');
let currentIdx = null;
const audio = document.getElementById('audio-el');

// ── BACKGROUND CANVAS ──
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let stars = [];

function initCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = Array.from({length: 80}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.2 + 0.2,
    speed: Math.random() * 0.15 + 0.05,
    op: Math.random(),
    dir: Math.random() > 0.5 ? 1 : -1,
  }));
}

function drawCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // gradient bg
  const g = ctx.createRadialGradient(canvas.width/2, canvas.height*0.3, 0, canvas.width/2, canvas.height*0.3, canvas.width * 0.8);
  g.addColorStop(0, 'rgba(124,111,255,0.04)');
  g.addColorStop(0.5, 'rgba(200
